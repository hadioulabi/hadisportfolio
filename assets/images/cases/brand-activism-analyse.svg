  <line x1="642" y1="174" x2="642" y2="206" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#ba)"></line>
  <line x1="118" y1="168" x2="118" y2="206" stroke="#d3dae8" stroke-width="1.5" stroke-dasharray="4,3"></line>

