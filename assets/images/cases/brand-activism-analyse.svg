  <rect x="30" y="262" width="700" height="16" rx="4" fill="#0c1e48"></rect>
  <text x="380" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">Haltung wirkt nur, wenn Thema, Praxis und visuelle Form zusammenpassen</text>

