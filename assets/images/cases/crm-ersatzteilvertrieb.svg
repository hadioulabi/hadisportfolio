<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <rect width="760" height="330" fill="#f6f8fb"></rect>

  <text x="380" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#0c1e48" letter-spacing="0.06em" data-t="0">CRM · ERSATZTEILVERTRIEB ÄGYPTEN</text>

  <!-- Datenbasis -->
  <text x="130" y="58" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4fa0" letter-spacing="0.04em" data-t="1">DATENBASIS</text>

  <rect x="30" y="68" width="200" height="40" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="130" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#17202e" data-t="2">Google Sheets</text>
  <text x="130" y="100" text-anchor="middle" font-size="10.5" fill="#58677a" data-t="3">Apps Script, AppSheet</text>

  <rect x="30" y="116" width="200" height="40" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="130" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#17202e" data-t="4">ERP-Abgleich</text>
  <text x="130" y="148" text-anchor="middle" font-size="10.5" fill="#58677a" data-t="5">Kunden, Umsätze</text>

  <line x1="230" y1="88" x2="284" y2="112" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>
  <line x1="230" y1="136" x2="284" y2="130" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>

  <!-- CRM-Kern -->
  <rect x="290" y="84" width="180" height="76" rx="8" fill="#edf2fa" stroke="#1d4fa0" stroke-width="1.5"></rect>
  <text x="380" y="108" text-anchor="middle" font-size="13" font-weight="800" fill="#0c1e48" letter-spacing="0.04em" data-t="6">CRM</text>
  <text x="380" y="127" text-anchor="middle" font-size="10.5" fill="#1d4fa0" data-t="7">automatische Segmentierung</text>
  <text x="380" y="143" text-anchor="middle" font-size="10.5" fill="#1d4fa0" data-t="8">ABC · Trends · Reaktivierung</text>

  <!-- Module -->
  <text x="630" y="58" text-anchor="middle" font-size="11" font-weight="800" fill="#2662b8" letter-spacing="0.04em" data-t="9">MODULE</text>

  <line x1="470" y1="108" x2="524" y2="88" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>
  <line x1="470" y1="122" x2="524" y2="136" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>
  <line x1="470" y1="138" x2="524" y2="182" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>

  <rect x="530" y="68" width="200" height="40" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="630" y="85" text-anchor="middle" font-size="11" font-weight="700" fill="#17202e" data-t="10">Kampagnen</text>
  <text x="630" y="100" text-anchor="middle" font-size="10.5" fill="#58677a" data-t="11">E-Mail &amp; WhatsApp, per Filter</text>

  <rect x="530" y="116" width="200" height="40" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="630" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="#17202e" data-t="12">Techniker-Modul</text>
  <text x="630" y="148" text-anchor="middle" font-size="10.5" fill="#58677a" data-t="13">Serviceeinsätze</text>

  <rect x="530" y="164" width="200" height="40" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="630" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#17202e" data-t="14">Rollen</text>
  <text x="630" y="196" text-anchor="middle" font-size="10.5" fill="#58677a" data-t="15">Ansichten je nach Rolle</text>

  <!-- Prospect-Modul -->
  <line x1="380" y1="160" x2="380" y2="216" stroke="#d3dae8" stroke-width="1.5" stroke-dasharray="4 3"></line>
  <text x="380" y="232" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4fa0" letter-spacing="0.04em" data-t="16">PROSPECT-MODUL · NEUKUNDEN</text>

  <rect x="30" y="244" width="155" height="34" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="107.5" y="265" text-anchor="middle" font-size="10.5" font-weight="700" fill="#17202e" data-t="17">25 Quellen</text>

  <rect x="205" y="244" width="155" height="34" rx="6" fill="#ffffff" stroke="#d3dae8" stroke-width="1.5"></rect>
  <text x="282.5" y="265" text-anchor="middle" font-size="10.5" font-weight="700" fill="#17202e" data-t="18">~6.000 Betriebe</text>

  <rect x="380" y="244" width="155" height="34" rx="6" fill="#edf2fa" stroke="#1d4fa0" stroke-width="1.5"></rect>
  <text x="457.5" y="265" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c1e48" data-t="19">1.700 priorisiert</text>

  <rect x="555" y="244" width="175" height="34" rx="6" fill="#0c1e48"></rect>
  <text x="642.5" y="265" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff" data-t="20">per Klick in den Kundenstamm</text>

  <line x1="185" y1="261" x2="200" y2="261" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>
  <line x1="360" y1="261" x2="375" y2="261" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>
  <line x1="535" y1="261" x2="550" y2="261" stroke="#d3dae8" stroke-width="1.5" marker-end="url(#crm)"></line>

  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#58677a" data-t="21">Schematische Darstellung · keine realen Kundendaten</text>

  <defs>
    <marker id="crm" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" stroke="#d3dae8" stroke-width="1" fill="none"></path>
    </marker>
  </defs>
</svg>
