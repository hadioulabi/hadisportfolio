<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Hadi Oulabi – Fashion Management, business operations, innovation management and AI-supported automation."
    >
    <title>Hadi Oulabi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
  </head>
  <body data-root="." data-page="home">
    <a class="skip-link" href="#main" data-i18n="ui.skipLink">Skip to content</a>

    <main id="main">
      <section class="hero-section" id="start">
        <div class="container hero-grid">
          <div class="hero-copy">
            <h1 data-i18n="ui.hero.greeting">Hey, I'm Hadi.</h1>
            <p class="hero-lead" data-i18n="ui.hero.lead"></p>
            <div class="hero-actions" data-i18n-aria="ui.hero.navLabel">
              <a class="button primary" href="#profil" data-i18n="ui.hero.btnProfile"></a>
              <a class="button secondary" href="#cases" data-i18n="ui.hero.btnCases"></a>
            </div>
          </div>

          <aside class="profile-card" id="profileCard" data-i18n-aria="ui.sections.profilEyebrow"></aside>
        </div>
      </section>

      <section class="band-section" id="profil">
        <div class="container">
          <div class="resume-intro">
            <div class="section-heading">
              <p class="eyebrow" data-i18n="ui.sections.profilEyebrow"></p>
              <h2 data-i18n="ui.sections.profilHeading"></h2>
            </div>
            <div class="fact-grid" id="factGrid"></div>
          </div>
        </div>
      </section>

      <section class="section" id="erfahrung">
        <div class="container">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="ui.sections.erfahrungEyebrow"></p>
            <h2 data-i18n="ui.sections.erfahrungHeading"></h2>
          </div>
          <div class="timeline" id="timeline"></div>
        </div>
      </section>

      <section class="band-section" id="kompetenzen">
        <div class="container">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="ui.sections.kompetenzenEyebrow"></p>
            <h2 data-i18n="ui.sections.kompetenzenHeading"></h2>
          </div>
          <div class="skill-grid" id="skillGrid"></div>
        </div>
      </section>

      <section class="section" id="cases">
        <div class="container">
          <div class="section-heading split-heading">
            <div>
              <p class="eyebrow" data-i18n="ui.sections.casesEyebrow"></p>
              <h2 data-i18n="ui.sections.casesHeading"></h2>
            </div>
          </div>

          <div class="case-group">
            <div class="case-grid lead" id="leadCases"></div>
          </div>

          <div class="case-group">
            <div class="case-grid" id="flagshipCases"></div>
          </div>

          <div class="case-group">
            <div class="case-grid compact" id="supportCases"></div>
          </div>
        </div>
      </section>

      <section class="band-section" id="kontakt">
        <div class="container contact-layout">
          <div class="section-heading">
            <p class="eyebrow" data-i18n="ui.sections.kontaktEyebrow"></p>
            <h2 class="contact-heading" data-i18n="ui.sections.kontaktHeading"></h2>
          </div>
          <div class="contact-panel">
            <div class="contact-list" id="contactList"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/content/en.js"></script>
    <script src="assets/js/content/de.js"></script>
    <script src="assets/js/content/ar.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
